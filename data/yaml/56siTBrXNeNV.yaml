content:
  markdown_content: |-
    Editor and main writer of the editorial columns _Revue musicale_ and _Éducation musicale_, the latter in collaboration with the composer and virtuosa [Juliette Dillon](https://nicholascorniaorpheus.github.io/tresor-des-demoiselles/entity/KFESriHnhBta).

    According to our sources, it seems that she started her column in 1853.
